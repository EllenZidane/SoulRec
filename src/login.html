<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Soul Rec</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Ícone Superior -->
            <div class="icon-header">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-music"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>

            <h2>Bem-vindo de volta</h2>
            <p class="subtitle">Entre com suas credenciais para acessar sua conta</p>

            <form id="formLogin">
                <div class="input-group">
                    <input type="email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <p class="signup-text">Não tem uma conta? <a href="register.html">Cadastre-se</a></p>
            <a href="../index.html" class="back-link">← Voltar para o site</a>
        </div>
    </div>

    <script src="../js/main.js"></script>

</body>
</html>
